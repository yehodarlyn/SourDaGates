<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SourDaGates — Crear Producto</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<div class="site-wrapper">
  <aside class="sidebar">
    <div class="sidebar__logo-wrap">
      <div class="sidebar__logo">SDG</div>
      <div class="sidebar__sub">SISTEMA ADMIN</div>
    </div>
    <ul class="sidebar__nav">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../admin.html">Panel Principal</a></li>
      <li><a href="admin_productos.html">Productos</a></li>
    </ul>
  </aside>

  <header class="topbar">
    <div class="topbar__brand">SourDaGates <span>Admin</span></div>
  </header>

  <main>
    <div class="anim-fade-up">
      <h1 class="page-title">Crear <span>Producto</span></h1>
      <p class="text-mono" style="font-size: 0.8rem; color: var(--gray-mid);">AÑADIR NUEVO ARTICULO AL INVENTARIO</p>
    </div>

    <section class="form-card mt-lg" style="max-width: 100%;">
      <form action="admin_productos.html" method="POST">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre del producto</label>
          <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Ej. Hoodie Reflective" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="descripcion">Descripcion</label>
          <textarea class="form-textarea" id="descripcion" name="descripcion" placeholder="Detalles técnicos de la prenda..." required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="precio">Precio</label>
            <input class="form-input" type="number" id="precio" name="precio" placeholder="0.00" step="0.01" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="stock">Cantidad en stock</label>
            <input class="form-input" type="number" id="stock" name="stock" placeholder="0" required />
          </div>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button type="submit" class="btn btn-primary">Añadir Producto</button>
          <a href="admin_productos.html" class="btn btn-outline">Cancelar</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>Aplicaciones Web</span> — Unidad 2
  </footer>
</div>

</body>
</html>
