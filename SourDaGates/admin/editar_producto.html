<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SourDaGates — Editar Producto</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<div class="site-wrapper">
  <aside class="sidebar">
    <div class="sidebar__logo-wrap">
      <div class="sidebar__logo">SDG</div>
      <div class="sidebar__sub">SISTEMA ADMIN</div>
    </div>
    <ul class="sidebar__nav">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../admin.html">Panel Principal</a></li>
      <li><a href="admin_productos.html">Productos</a></li>
    </ul>
  </aside>

  <header class="topbar">
    <div class="topbar__brand">SourDaGates <span>Admin</span></div>
  </header>

  <main>
    <div class="anim-fade-up">
      <h1 class="page-title">Editar <span>Producto</span></h1>
      <p class="text-mono" style="font-size: 0.8rem; color: var(--gray-mid);">ACTUALIZAR INFORMACION DEL ARTICULO</p>
    </div>

    <section class="form-card mt-lg" style="max-width: 100%;">
      <form action="admin_productos.html" method="POST">
        <div class="form-group">
          <label class="form-label" for="nombre_edit">Nombre del producto</label>
          <input class="form-input" type="text" id="nombre_edit" name="nombre" value="Sudadera Noir Oversized" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="desc_edit">Descripcion</label>
          <textarea class="form-textarea" id="desc_edit" name="descripcion" required>Sudadera de algodon pesado con corte urbano industrial.</textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="precio_edit">Precio</label>
          <input class="form-input" type="number" id="precio_edit" name="precio" value="85.00" step="0.01" required />
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button type="submit" class="btn btn-primary">Actualizar</button>
          <a href="admin_productos.html" class="btn btn-outline">Cancelar</a>
        </div>
      </form>
    </section>
    
  </main>

  <footer class="site-footer">
    <span>Aplicaciones Web</span> — Unidad 2
  </footer>
</div>


</body>
</html>
