<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SourDaGates — Gestion de Productos</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<div class="site-wrapper">
  <aside class="sidebar">
    <div class="sidebar__logo-wrap">
      <div class="sidebar__logo">SDG</div>
      <div class="sidebar__sub">ADMIN PANEL</div>
    </div>
    <ul class="sidebar__nav">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../admin.html">Volver al Panel</a></li>
    </ul>
  </aside>

  <header class="topbar">
    <div class="topbar__brand">SourDaGates <span>Admin</span></div>
    <div class="topbar__actions">
      <button class="topbar__btn">Perfil Admin</button>
      <button class="topbar__btn topbar__btn--logout">Salir</button>
    </div>
  </header>

  <main>
    <div class="anim-fade-up" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1 class="page-title">Gestion de <span>Productos</span></h1>
      </div>
      <a href="crear_producto.html" class="btn btn-primary">+ CREAR PRODUCTO</a>
    </div>

    <section class="mt-lg">
      <div class="card" style="padding: 0; overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nombre del Producto</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            
            <tr>
              <td>Sudadera Noir Oversized</td>
              <td>$85.00</td>
              <td>
              <a href="editar_producto.html" class="btn-ghost" style="color: var(--neon); text-decoration: none; font-size: 0.7rem; font-weight: bold;">
                EDITAR
              </a>
              
              <button class="btn-ghost" style="color: #ff3b3b; margin-left: 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer;">
                ELIMINAR
              </button>
            </td>
            </tr>
            <tr>
              <td>Pantalones Cargo Industriales</td>
              <td>$110.00</td>
              <td>
              <a href="editar_producto.html" class="btn-ghost" style="color: var(--neon); text-decoration: none; font-size: 0.7rem; font-weight: bold;">
                EDITAR
              </a>
              
              <button class="btn-ghost" style="color: #ff3b3b; margin-left: 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer;">
                ELIMINAR
              </button>
            </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Aplicaciones Web</span> — Unidad 2
  </footer>
</div>

</body>
</html>
