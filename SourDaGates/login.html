<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SourDaGates — Iniciar Sesion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

<div class="site-wrapper" style="justify-content: center; align-items: center; display: flex;">
  
  <section class="form-card anim-fade-up" style="width: 100%; max-width: 400px; padding: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div class="sidebar__logo" style="margin: 0 auto 10px;">SDG</div>
      <h1 style="font-family: var(--font-display); color: var(--neon); font-size: 1.8rem;">ACCESO_SISTEMA</h1>
      <p style="color: var(--gray-mid); font-family: var(--font-mono); font-size: 0.75rem;">INGRESA TUS CREDENCIALES</p>
    </div>

    <form action="index.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="email">Correo Electronico</label>
        <input type="email" id="email" class="form-input" placeholder="usuario@dominio.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required />
      </div>

      <div style="margin-top: 30px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          ENTRAR AL SISTEMA
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--black-border); padding-top: 20px;">
      <p style="color: var(--gray-text); font-size: 0.85rem;">¿No tienes cuenta?</p>
      <a href="registro.html" style="color: var(--neon); text-decoration: none; font-weight: bold; font-size: 0.9rem;">
        REGÍSTRATE AQUI
      </a>
    </div>
  </section>

</div>

<footer style="position: absolute; bottom: 20px; width: 100%; text-align: center; color: var(--gray-mid); font-size: 0.7rem; font-family: var(--font-mono);">
  SOURDAGATES // APLICACIONES WEB - UNIDAD 2
</footer>

</body>
</html>
